[pytest]
testpaths = tests
python_files = test_*.py
xfail_strict = false
# Retry only network failures or 5xx responses from the shared public demo, never assertion mismatches.
addopts =
    -ra
    --reruns 2 --reruns-delay 3
    --only-rerun "playwright._impl._errors"
    --only-rerun "HTTP 5\d\d"
    --html=report/report.html --self-contained-html
